name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secret
        run: |
          if [ -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_ROCK_021E4890F }}" ]; then
            echo "Secret is present"
          else
            echo "Secret is EMPTY"
            exit 1
          fi

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_ROCK_021E4890F }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""
          repo_token: ${{ secrets.GITHUB_TOKEN }}      

